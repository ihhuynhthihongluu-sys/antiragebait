<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenNet - Radar Quét Rage Bait Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; min-height: 100vh; background-color: #1a0b1c; color: #fdf2f8; display: flex; flex-direction: column; align-items: center; padding: 20px 15px; overflow-x: hidden; }
        .blob { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.6; animation: float 12s infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #e11d48; } 
        .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: #d946ef; animation-delay: -6s;} 
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }

        .tabs-container { display: flex; gap: 15px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 20px; border: 1px solid rgba(244, 114, 182, 0.2); z-index: 10; justify-content: center;}
        .tab-btn { background: transparent; color: #fbcfe8; border: none; padding: 10px 25px; border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 14px;}
        .tab-btn.active { background: linear-gradient(90deg, #db2777, #c026d3); color: white; box-shadow: 0 5px 15px rgba(219, 39, 119, 0.5); }

        .khung-chinh { background: rgba(45, 20, 44, 0.6); backdrop-filter: blur(20px); border-radius: 24px; padding: 30px; width: 100%; max-width: 800px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,192,203,0.15); display: none; margin-bottom: 30px; box-sizing: border-box;}
        .khung-chinh.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .mascot-container { display: flex; flex-direction: column; align-items: center; margin-top: -30px; margin-bottom: 20px; }
        .bubble { background: #db2777; color: white; padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 10px; position: relative; box-shadow: 0 5px 15px rgba(219, 39, 119, 0.4); animation: bounceSmall 2s infinite ease-in-out; text-align: center;}
        .bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border-width: 8px 8px 0; border-style: solid; border-color: #db2777 transparent; }
        .chibi-mascot { width: 110px; filter: drop-shadow(0 10px 15px rgba(219, 39, 119, 0.5)); animation: bounce 2.5s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes bounceSmall { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        h2 { text-align: center; margin-top: 0; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #f472b6 0%, #c026d3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .chu-thich { text-align: center; color: #fbcfe8; margin-bottom: 20px; font-weight: 600; font-size: 14px;}

        button.btn-main { width: 100%; padding: 15px; background: linear-gradient(90deg, #db2777, #c026d3); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        button.btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(219,39,119,0.5); }
        button.btn-main:disabled { background: #4a294b; color: #a58ca7; cursor: not-allowed; transform: none; box-shadow: none;}

        textarea { width: 100%; height: 100px; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid rgba(244,114,182,0.2); border-radius: 12px; color: #fff; font-size: 15px; font-family: inherit; margin-bottom: 15px; resize: vertical;}
        textarea:focus { outline: none; border-color: #f472b6; }
        .upload-section { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .upload-btn { background: rgba(255, 192, 203, 0.1); border: 1px dashed rgba(244, 114, 182, 0.4); border-radius: 12px; padding: 12px 20px; cursor: pointer; font-size: 14px; font-weight: 600; color: #f472b6; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .upload-btn:hover { background: rgba(244, 114, 182, 0.15); border-color: #f472b6; }
        input[type="file"] { display: none; }
        .media-preview-container { position: relative; display: none; }
        .media-preview { max-width: 120px; max-height: 120px; border-radius: 10px; border: 2px solid #db2777; object-fit: cover; }
        .remove-media-btn { position: absolute; top: -8px; right: -8px; background: #e11d48; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .ket-qua-box { margin-top: 20px; padding: 20px; border-radius: 16px; background: rgba(0,0,0,0.4); display: none; }
        .diem-so-container { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px;}
        .tieude-ketqua { font-size: 16px; color: #fbcfe8; font-weight: 600; text-transform: uppercase; }
        .so-diem-to { font-size: 36px; font-weight: 800; line-height: 1; }
        .thanh-diem-bg { width: 100%; background: #2b1329; height: 15px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .thanh-diem { height: 100%; width: 0%; background: #10b981; transition: 1s; }
        #van-ban-ket-qua { line-height: 1.6; color: #fdf2f8; margin-top: 15px; font-size: 15px;}
        .tu-khoa { font-weight: 800; color: #fff; display: inline-block; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; font-size: 12px; background: linear-gradient(90deg, #f472b6, #d946ef); padding: 4px 12px; border-radius: 8px; }

        .breathe-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 350px; position: relative; background: rgba(0,0,0,0.4); border-radius: 20px; margin-bottom: 20px; border: 2px solid #db2777; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.8); }
        #webcam-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; z-index: 1; transform: scaleX(-1); filter: grayscale(30%) sepia(20%) hue-rotate(280deg); }
        .webcam-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.7) 100%); z-index: 2; display: none; }
        .sensor-hud { position: absolute; top: 15px; left: 15px; z-index: 5; display: none; flex-direction: column; gap: 8px; }
        .hud-item { background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 6px; border-left: 3px solid #10b981; font-size: 12px; font-weight: bold; color: #34d399; font-family: monospace; }
        .breathe-text { font-size: 24px; font-weight: 800; color: #fdf2f8; margin-bottom: 40px; text-align: center; height: 30px; text-transform: uppercase; letter-spacing: 2px; transition: color 0.5s; z-index: 5; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .circle-outer { width: 150px; height: 150px; border-radius: 50%; background: rgba(219, 39, 119, 0.15); border: 2px solid rgba(219, 39, 119, 0.5); display: flex; align-items: center; justify-content: center; transition: all 4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 30px rgba(219, 39, 119, 0.4); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -35%); z-index: 5; }
        .circle-inner { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, rgba(244,114,182,0.8), rgba(219,39,119,0.5)); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; transition: all 4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .circle-outer.expand { width: 280px; height: 280px; background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 0 50px rgba(16, 185, 129, 0.5); }
        .circle-inner.expand { width: 140px; height: 140px; background: radial-gradient(circle, rgba(52,211,153,0.8), rgba(16,185,129,0.5)); }
        .breathe-controls { display: flex; gap: 10px; margin-bottom: 20px; width: 100%;}
        .btn-cam { flex: 1; background: rgba(255, 192, 203, 0.1); border: 1px solid #f472b6; color: #f472b6; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .breathe-tip { font-size: 14px; color: #cbd5e1; text-align: center; line-height: 1.6; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border-left: 4px solid #10b981; }
    </style>
</head>
