<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenNet - Check Rage Bait Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; min-height: 100vh; background-color: #1a0b1c; color: #fdf2f8; display: flex; flex-direction: column; align-items: center; padding: 20px 15px; overflow-x: hidden; }
        .blob { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.6; animation: float 12s infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #e11d48; } 
        .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: #d946ef; animation-delay: -6s;} 
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }

        .tabs-container { display: flex; gap: 15px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 20px; border: 1px solid rgba(244, 114, 182, 0.2); z-index: 10; justify-content: center;}
        .tab-btn { background: transparent; color: #fbcfe8; border: none; padding: 12px 25px; border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 15px; letter-spacing: 0.5px;}
        .tab-btn.active { background: linear-gradient(90deg, #db2777, #c026d3); color: white; box-shadow: 0 5px 15px rgba(219, 39, 119, 0.5); }

        .khung-chinh { background: rgba(45, 20, 44, 0.6); backdrop-filter: blur(20px); border-radius: 24px; padding: 30px; width: 100%; max-width: 800px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,192,203,0.15); display: none; margin-bottom: 30px; box-sizing: border-box;}
        .khung-chinh.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .mascot-container { display: flex; flex-direction: column; align-items: center; margin-top: -10px; margin-bottom: 20px; }
        .chibi-mascot { width: 90px; filter: drop-shadow(0 10px 15px rgba(219, 39, 119, 0.5)); animation: bounce 2.5s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        h2 { text-align: center; margin-top: 0; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #f472b6 0%, #c026d3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .chu-thich { text-align: center; color: #fbcfe8; margin-bottom: 20px; font-weight: 600; font-size: 14px;}

        button.btn-main { width: 100%; padding: 15px; background: linear-gradient(90deg, #db2777, #c026d3); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        button.btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(219,39,119,0.5); }
        button.btn-main:disabled { background: #4a294b; color: #a58ca7; cursor: not-allowed; transform: none; box-shadow: none;}

        textarea { width: 100%; height: 120px; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid rgba(244,114,182,0.2); border-radius: 12px; color: #fff; font-size: 16px; font-family: inherit; margin-bottom: 15px; resize: vertical;}
        textarea:focus { outline: none; border-color: #f472b6; }
        .upload-section { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .upload-btn { background: rgba(255, 192, 203, 0.1); border: 1px dashed rgba(244, 114, 182, 0.4); border-radius: 12px; padding: 12px 20px; cursor: pointer; font-size: 14px; font-weight: 600; color: #f472b6; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .upload-btn:hover { background: rgba(244, 114, 182, 0.15); border-color: #f472b6; }
        input[type="file"] { display: none; }
        .media-preview-container { position: relative; display: none; }
        .media-preview { max-width: 120px; max-height: 120px; border-radius: 10px; border: 2px solid #db2777; object-fit: cover; }
        .remove-media-btn { position: absolute; top: -8px; right: -8px; background: #e11d48; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        
        .ket-qua-box { margin-top: 20px; padding: 25px; border-radius: 16px; background: rgba(0,0,0,0.5); border: 1px solid rgba(219, 39, 119, 0.3); display: none; }
        .diem-so-container { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px;}
        .tieude-ketqua { font-size: 16px; color: #fbcfe8; font-weight: 600; text-transform: uppercase; }
        .so-diem-to { font-size: 42px; font-weight: 800; line-height: 1; min-width: 80px; text-align: right;}
        
        .thanh-diem-bg { width: 100%; background: #2b1329; height: 18px; border-radius: 10px; margin: 15px 0; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);}
        .thanh-diem { height: 100%; width: 0%; background: #10b981; transition: width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.5s; position: relative;}
        .thanh-diem::after { content: ""; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%, transparent); background-size: 20px 20px; animation: moveStripes 1s linear infinite; }
        @keyframes moveStripes { 0% { background-position: 0 0; } 100% { background-position: 20px 0; } }

        #van-ban-ket-qua { line-height: 1.8; color: #fdf2f8; margin-top: 20px; font-size: 16px; text-align: justify;}
        .tu-khoa { font-weight: 800; color: #fff; display: block; width: fit-content; margin-top: 30px; margin-bottom: 15px; text-transform: uppercase; font-size: 14px; background: linear-gradient(90deg, #f472b6, #d946ef); padding: 6px 16px; border-radius: 8px; box-shadow: 0 4px 10px rgba(219, 39, 119, 0.3); clear: both;}
        .ket-luan-highlight { font-size: 20px; border-bottom: 1px solid rgba(244, 114, 182, 0.3); padding-bottom: 10px; margin-bottom: 20px; }

        .breathe-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 350px; position: relative; background: rgba(0,0,0,0.4); border-radius: 20px; margin-bottom: 20px; border: 2px solid #db2777; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.8); }
        #webcam-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; z-index: 1; transform: scaleX(-1); filter: grayscale(30%) sepia(20%) hue-rotate(280deg); }
        .webcam-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.7) 100%); z-index: 2; display: none; }
        .sensor-hud { position: absolute; top: 15px; left: 15px; z-index: 5; display: none; flex-direction: column; gap: 8px; }
        .hud-item { background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 6px; border-left: 3px solid #10b981; font-size: 12px; font-weight: bold; color: #34d399; font-family: monospace; }
        .breathe-text { font-size: 24px; font-weight: 800; color: #fdf2f8; margin-bottom: 40px; text-align: center; height: 30px; text-transform: uppercase; letter-spacing: 2px; transition: color 0.5s; z-index: 5; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .circle-outer { width: 150px; height: 150px; border-radius: 50%; background: rgba(219, 39, 119, 0.15); border: 2px solid rgba(219, 39, 119, 0.5); display: flex; align-items: center; justify-content: center; transition: all 4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 30px rgba(219, 39, 119, 0.4); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -35%); z-index: 5; }
        .circle-inner { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, rgba(244,114,182,0.8), rgba(219,39,119,0.5)); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; transition: all 4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .circle-outer.expand { width: 280px; height: 280px; background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 0 50px rgba(16, 185, 129, 0.5); }
        .circle-inner.expand { width: 140px; height: 140px; background: radial-gradient(circle, rgba(52,211,153,0.8), rgba(16,185,129,0.5)); }
        .breathe-controls { display: flex; gap: 10px; margin-bottom: 20px; width: 100%;}
        .btn-cam { flex: 1; background: rgba(255, 192, 203, 0.1); border: 1px solid #f472b6; color: #f472b6; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .breathe-tip { font-size: 14px; color: #cbd5e1; text-align: center; line-height: 1.6; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border-left: 4px solid #10b981; }
    </style>
</head>
<body>

    <div class="blob blob-1"></div><div class="blob blob-2"></div>

    <div class="mascot-container">
        <img class="chibi-mascot" id="hinh-mascot" src="https://cdn-icons-png.flaticon.com/512/4712/4712010.png" alt="Chibi AI">
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('tab-radar', this)">Check Ragebait</button>
        <button class="tab-btn" onclick="switchTab('tab-breathe', this)">Làm dịu cơn giận dữ</button>
    </div>

    <div id="tab-radar" class="khung-chinh active">
        <h2>CHECK RAGE BAIT</h2>
        <br>
        <div class="input-group">
            <textarea id="o-nhap-lieu" placeholder="Dán nội dung bài viết, bình luận cần quét vào đây..."></textarea>
        </div>
        <div class="upload-section">
            <label class="upload-btn" for="mediaInput">🎬 Tải Ảnh/Video (Hoặc dán văn bản)</label>
            <input type="file" id="mediaInput" accept="image/*, video/*" onchange="previewMedia(event)">
            <div class="media-preview-container" id="previewContainer">
                <img class="media-preview" id="imgPreview" src="" alt="Xem trước" style="display:none;">
                <button class="remove-media-btn" onclick="removeMedia()">✕</button>
            </div>
        </div>
        <button class="btn-main" id="nut-quet" onclick="batDauQuetGroq()">Phân tích tự động</button>
        <div class="ket-qua-box" id="khung-ket-qua">
            <div class="diem-so-container">
                <span class="tieude-ketqua" id="trang-thai">Đang xử lý...</span>
                <span class="so-diem-to" id="so-diem" style="color: #f472b6;">0%</span>
            </div>
            <div class="thanh-diem-bg"><div class="thanh-diem" id="thanh-mau"></div></div>
            <div id="van-ban-ket-qua"></div>
        </div>
    </div>

    <div id="tab-breathe" class="khung-chinh">
        <h2>LÀM DỊU CƠN GIẬN DỮ</h2>
        <p class="chu-thich">Nhìn nhận bản thân và làm dịu cảm xúc</p>
        <div class="breathe-container">
            <video id="webcam-feed" autoplay playsinline muted></video>
            <div class="webcam-overlay" id="webcam-overlay"></div>
            <div class="sensor-hud" id="sensor-hud">
                <div class="hud-item">SYS: TÍCH CỰC</div>
                <div class="hud-item" id="focus-level">TẬP TRUNG: 0%</div>
            </div>
            <div class="breathe-text" id="breathe-text">SẴN SÀNG CHƯA?</div>
            <div class="circle-outer" id="circle-outer">
                <div class="circle-inner" id="circle-inner"></div>
            </div>
        </div>
        <div class="breathe-controls">
            <button class="btn-cam" id="btn-cam" onclick="toggleCamera()">📷 Bật Gương</button>
            <button class="btn-main" id="btn-breathe" onclick="toggleBreathe()">Bắt đầu tập thở</button>
        </div>
        <div class="breathe-tip" style="margin-top: 20px;">
            <b>💡 Khoa học Hành vi:</b> Bật Camera để nhìn vào biểu cảm của chính mình kết hợp nhịp thở thư giãn giúp lấy lại bình tĩnh.
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.khung-chinh').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        let base64Media = ""; 
        function previewMedia(event) {
            const file = event.target.files[0];
            if (file) {
                const previewContainer = document.getElementById('previewContainer');
                const imgPreview = document.getElementById('imgPreview');
                previewContainer.style.display = 'block';

                if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(file);
                    video.muted = true;
                    video.play();
                    
                    video.addEventListener('loadeddata', () => {
                        video.currentTime = 1; 
                    });
                    
                    video.addEventListener('seeked', () => {
                        const canvas = document.createElement('canvas');
                        let w = video.videoWidth;
                        let h = video.videoHeight;
                        
                        if (w > 800) { h = h * (800 / w); w = 800; }
                        
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        base64Media = canvas.toDataURL('image/jpeg', 0.6);
                        imgPreview.src = base64Media;
                        imgPreview.style.display = 'block';
                        video.pause();
                    });
                } else {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            let w = img.width;
                            let h = img.height;
                            
                            if (w > 800) { h = h * (800 / w); w = 800; }
                            
                            canvas.width = w;
                            canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                            
                            base64Media = canvas.toDataURL('image/jpeg', 0.6);
                            imgPreview.src = base64Media;
                            imgPreview.style.display = 'block';
                        }
                        img.src = e.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            }
        }

        function removeMedia() {
            document.getElementById('mediaInput').value = ""; 
            document.getElementById('previewContainer').style.display = 'none';
            base64Media = ""; 
        }

        async function batDauQuetGroq() {
            let noiDungText = document.getElementById('o-nhap-lieu').value.trim();
            if (noiDungText === "" && !base64Media) return alert("Bạn cần nhập nội dung bài viết hoặc tải lên hình/video cần phân tích!");

            document.getElementById('nut-quet').innerText = "ĐANG TÍNH TOÁN DỮ LIỆU...";
            document.getElementById('nut-quet').disabled = true;
            let ketQuaBox = document.getElementById('khung-ket-qua');
            ketQuaBox.style.display = "block";
            document.getElementById('trang-thai').innerText = "Đang kết nối API...";
            
            let thanhMau = document.getElementById('thanh-mau');
            let soDiem = document.getElementById('so-diem');
            thanhMau.style.width = "0%";
            soDiem.innerText = "0%";
            
            let vanBanKetQua = document.getElementById('van-ban-ket-qua');
            vanBanKetQua.innerHTML = "Đang kết nối hệ thống...";

            let promptSystem = `Bạn là chuyên gia phân tích truyền thông xã hội. Hãy phân tích nội dung xem có phải Rage Bait (thao túng phẫn nộ) không. BẮT BUỘC TRẢ VỀ ĐÚNG FORMAT SAU (Tuyệt đối KHÔNG dùng dấu sao ** hay in đậm):
ĐIỂM: [1 số từ 0 đến 100]
KẾT LUẬN: [RAGE BAIT hoặc AN TOÀN]
PHÂN TÍCH: [Phân tích thật chi tiết, cặn kẽ ý đồ của tác giả hoặc nội dung trong ảnh/video, giải thích rõ tại sao lại như vậy, viết dài sâu sắc ít nhất 3 đến 5 câu]
BẪY TÂM LÝ: [Liệt kê và phân tích sâu các thủ thuật thao túng tâm lý được sử dụng, giải thích chi tiết cơ chế tác động lên người đọc, viết dài ít nhất 3 đến 5 câu]
LỜI KHUYÊN: [Đưa ra chiến lược ứng phó cụ thể, giải thích lợi ích của việc làm theo lời khuyên, đưa ra các hành động cụ thể rõ ràng, viết dài ít nhất 3 đến 5 câu]`;
            
            let textToSend = promptSystem;
            if (noiDungText !== "") {
                textToSend += `\n\nNội dung văn bản đính kèm: "${noiDungText}"`;
            }
            if (base64Media !== "") {
                textToSend += `\n\nHãy phân tích hình ảnh/khung hình video được đính kèm này.`;
            }

            let messageContent = base64Media !== "" 
                ? [
                    { type: "text", text: textToSend },
                    { type: "image_url", image_url: { url: base64Media } }
                  ]
                : textToSend;

            try {
                let modelsRes = await fetch("https://api.groq.com/openai/v1/models", {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY.trim()}` }
                });
                let modelsData = await modelsRes.json();
                if (modelsData.error) throw new Error(modelsData.error.message);

                let allAvailableModels = modelsData.data.map(m => m.id);
                let validModels = [];

                if (base64Media !== "") {
                    let visionModels = allAvailableModels.filter(id => id.toLowerCase().includes("vision") || id.toLowerCase().includes("llava") || id.toLowerCase().includes("llama-3.2"));
                    let textModels = allAvailableModels.filter(id => !id.toLowerCase().includes("guard") && !id.toLowerCase().includes("whisper") && !id.toLowerCase().includes("embed"));
                    validModels = [...new Set([...visionModels, ...textModels])];
                } else {
                    validModels = allAvailableModels.filter(id => !id.toLowerCase().includes("guard") && !id.toLowerCase().includes("whisper") && !id.toLowerCase().includes("vision") && !id.toLowerCase().includes("embed"));
                }

                if (validModels.length === 0) throw new Error("Không tìm thấy model nào khả dụng trên tài khoản của bạn.");

                let successData = null;
                let usedModel = "";
                let lastErrorMsg = "Lỗi không xác định.";

                for (let i = 0; i < validModels.length; i++) {
                    let currentModel = validModels[i];
                    vanBanKetQua.innerHTML = `Đang thử nghiệm model (${i+1}/${validModels.length}): <b>${currentModel}</b>...`;
                    
                    try {
                        let response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${GROQ_API_KEY.trim()}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                model: currentModel,
                                messages: [{ role: "user", content: messageContent }],
                                temperature: 0.3,
                                max_tokens: 1500
                            })
                        });

                        let data = await response.json();
                        if (!data.error) {
                            successData = data;
                            usedModel = currentModel;
                            break; 
                        } else {
                            lastErrorMsg = data.error.message;
                        }
                    } catch (err) {
                        lastErrorMsg = err.message;
                    }
                }

                if (!successData) {
                    throw new Error(lastErrorMsg);
                }

                let vanBanAI = successData.choices[0].message.content;
                vanBanAI = vanBanAI.replace(/\*\*/g, ''); 

                let timDiem = vanBanAI.match(/ĐIỂM.*?(\d+)/i);
                let diemSo = timDiem ? parseInt(timDiem[1]) : 0;
                if(diemSo > 100) diemSo = 100;
                
                let targetColor = "";
                let targetBg = "";
                if(diemSo > 65) {
                    document.getElementById('trang-thai').innerText = "CẢNH BÁO ĐỘC HẠI ⚠";
                    targetColor = "#f43f5e"; 
                    targetBg = "linear-gradient(90deg, #e11d48, #f43f5e)";
                } else if (diemSo > 30) {
                    document.getElementById('trang-thai').innerText = "CÓ DẤU HIỆU THAO TÚNG";
                    targetColor = "#f59e0b"; 
                    targetBg = "linear-gradient(90deg, #d97706, #f59e0b)";
                } else {
                    document.getElementById('trang-thai').innerText = "NỘI DUNG AN TOÀN";
                    targetColor = "#10b981"; 
                    targetBg = "linear-gradient(90deg, #059669, #10b981)";
                }

                soDiem.style.color = targetColor;
                thanhMau.style.background = targetBg;
                
                setTimeout(() => {
                    thanhMau.style.width = diemSo + "%";
                    
                    let currentScore = 0;
                    let duration = 1200; 
                    let intervalTime = 20; 
                    let steps = duration / intervalTime;
                    let increment = diemSo / steps;
                    
                    if (diemSo > 0) {
                        let timer = setInterval(() => {
                            currentScore += increment;
                            if(currentScore >= diemSo) {
                                currentScore = diemSo;
                                clearInterval(timer);
                            }
                            soDiem.innerText = Math.floor(currentScore) + "%";
                        }, intervalTime);
                    }
                }, 100);

                vanBanKetQua.innerHTML = `<span style="color:#10b981; font-size:12px; display:block; margin-bottom:15px;">(Đã phân tích qua model: ${usedModel})</span>` + 
                    vanBanAI
                    .replace(/ĐIỂM:.*\n/i, '')
                    .replace(/KẾT LUẬN:(.*)/i, "<div class='ket-luan-highlight'><b style='color:#fbcfe8;'>KẾT LUẬN:</b><b style='color:#10b981;'>$1</b></div>")
                    .replace(/PHÂN TÍCH:/i, '<div class="tu-khoa">PHÂN TÍCH AI</div>')
                    .replace(/BẪY TÂM LÝ:/i, '<div class="tu-khoa">BẪY TÂM LÝ</div>')
                    .replace(/LỜI KHUYÊN:/i, '<div class="tu-khoa">LỜI KHUYÊN</div>')
                    .replace(/(\d+\.)\s/g, '<br><br><span style="color:#f472b6; font-weight:800; font-size:18px;">$1</span> ')
                    .replace(/(\s|^)-\s/g, '<br><br><span style="color:#f472b6; font-weight:800; font-size:18px;">•</span> ')
                    .replace(/\[|\]/g, ''); 

            } catch (loi) {
                vanBanKetQua.innerHTML = `<span style='color:#f43f5e;'>Lỗi API Groq: ${loi.message}</span>`;
            }

            document.getElementById('nut-quet').innerText = "Phân tích tự động";
            document.getElementById('nut-quet').disabled = false;
        }

        let stream = null;
        async function toggleCamera() {
            const video = document.getElementById('webcam-feed'); 
            const overlay = document.getElementById('webcam-overlay');
            const hud = document.getElementById('sensor-hud'); 
            const camBtn = document.getElementById('btn-cam');

            if (stream) {
                stream.getTracks().forEach(track => track.stop()); 
                stream = null;
                video.style.opacity = '0';
                setTimeout(() => { 
                    video.style.display = 'none'; 
                    overlay.style.display = 'none'; 
                    hud.style.display = 'none'; 
                }, 500);
                camBtn.innerText = "📷 Bật Gương"; 
                camBtn.style.color = "#f472b6"; 
                camBtn.style.borderColor = "#f472b6"; 
                camBtn.style.background = "rgba(255, 192, 203, 0.1)";
            } else {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream; 
                    video.style.display = 'block'; 
                    overlay.style.display = 'block'; 
                    hud.style.display = 'flex';
                    setTimeout(() => { video.style.opacity = '0.6'; }, 100);
                    camBtn.innerText = "🔴 Tắt Cảm Biến"; 
                    camBtn.style.color = "#f43f5e"; 
                    camBtn.style.borderColor = "#f43f5e"; 
                    camBtn.style.background = "rgba(244, 63, 94, 0.2)";
                } catch (err) { 
                    alert("Vui lòng cho phép Camera!"); 
                }
            }
        }

        let breatheInterval, focusInterval, isBreathing = false, exhaleTimeout, focusScore = 0;
        function toggleBreathe() {
            const outer = document.getElementById('circle-outer'); 
            const inner = document.getElementById('circle-inner');
            const text = document.getElementById('breathe-text'); 
            const btn = document.getElementById('btn-breathe');
            const focusText = document.getElementById('focus-level');

            if (isBreathing) {
                isBreathing = false; 
                clearInterval(breatheInterval); 
                clearInterval(focusInterval); 
                clearTimeout(exhaleTimeout);
                outer.classList.remove('expand'); 
                inner.classList.remove('expand');
                text.innerText = "SẴN SÀNG CHƯA?"; 
                text.style.color = "#fdf2f8";
                btn.innerText = "Bắt đầu tập thở"; 
                btn.style.background = "linear-gradient(90deg, #db2777, #c026d3)";
                focusScore = 0; 
                focusText.innerText = `TẬP TRUNG: 0%`; 
                return;
            }

            isBreathing = true; 
            btn.innerText = "Dừng lại"; 
            btn.style.background = "linear-gradient(90deg, #db2777, #c026d3)";
            
            focusInterval = setInterval(() => {
                if (stream && focusScore < 99) { 
                    focusScore += Math.floor(Math.random() * 3) + 1; 
                    if(focusScore > 99) focusScore = 99; 
                    focusText.innerText = `TẬP TRUNG: ${focusScore}%`; 
                }
            }, 1000);

            function breatheCycle() {
                text.innerText = "HÍT VÀO TỪ TỪ..."; 
                text.style.color = "#34d399";
                outer.classList.add('expand'); 
                inner.classList.add('expand');
                exhaleTimeout = setTimeout(() => {
                    text.innerText = "THỞ RA NHẸ NHÀNG..."; 
                    text.style.color = "#f472b6";
                    outer.classList.remove('expand'); 
                    inner.classList.remove('expand');
                }, 4000); 
            }
            breatheCycle(); 
            breatheInterval = setInterval(breatheCycle, 8000);
        }
    </script>
</body>
