<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-RageBait & Gương Chánh Niệm</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .tab-btn { padding: 10px 20px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #3498db; color: white; }
        .khung-chinh { display: none; }
        .khung-chinh.active { display: block; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; }
        button.action-btn { background: #2ecc71; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; }
        button.action-btn:hover { background: #27ae60; }
        .ket-qua { margin-top: 20px; padding: 15px; background: #f9f9f9; border-left: 5px solid #3498db; border-radius: 4px; line-height: 1.6; }
        .cam-bien-box { text-align: center; padding: 40px; border: 2px dashed #bdc3c7; border-radius: 12px; background: #fafafa; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Anti-RageBait & Gương Chánh Niệm</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('radar', this)">Radar AI (Nhận diện Rage Bait)</button>
        <button class="tab-btn" onclick="switchTab('guong', this)">Gương Chánh Niệm (Tập thở)</button>
    </div>

    <!-- Phân hệ 1: Radar AI -->
    <div id="radar" class="khung-chinh active">
        <h3>Phân tích văn bản/nội dung kích động (Rage Bait)</h3>
        <p>Nhập đoạn văn bản hoặc tiêu đề mạng xã hội cần kiểm tra:</p>
        <textarea id="input-text" placeholder="Ví dụ: 'Sốc tận óc! Không xem đoạn này thì bạn đã mất tiền oan...'"></textarea>
        <button class="action-btn" onclick="quetRageBait()">Quét & Phân tích bằng Radar AI</button>
        <div id="ket-qua-radar" class="ket-qua" style="display:none;"></div>
    </div>

    <!-- Phân hệ 2: Gương Chánh Niệm -->
    <div id="guong" class="khung-chinh">
        <h3>Gương Chánh Niệm - Ổn định cảm xúc</h3>
        <div class="cam-bien-box">
            <p id="trang-thai-tho" style="font-size: 20px; font-weight: bold; color: #e67e22;">Nhấn Bắt đầu để thực hiện bài tập hít thở sâu 1 phút.</p>
            <button class="action-btn" style="margin-top: 20px; width: auto;" onclick="batDauTho()">Bắt đầu Hít Thở</button>
        </div>
    </div>
</div>

<script>
function switchTab(tabId, btnElement) {
    document.querySelectorAll('.khung-chinh').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
}

function quetRageBait() {
    const text = document.getElementById('input-text').value.trim();
    const box = document.getElementById('ket-qua-radar');
    box.style.display = 'block';
    
    if(!text) {
        box.innerHTML = "<b style='color:red;'>Vui lòng nhập nội dung cần kiểm tra!</b>";
        return;
    }
    
    box.innerHTML = "⏳ Radar AI đang phân tích cấu trúc từ ngữ và mức độ kích động cảm xúc...";
    
    setTimeout(() => {
        let mucDo = "Thấp (An toàn)";
        let mau = "green";
        let giai thích = "Nội dung mang tính thông tin bình thường, ít sử dụng từ ngữ thao túng tâm lý.";
        
        const lower = text.toLowerCase();
        if(lower.includes("sốc") || lower.includes("kinh hoàng") || lower.includes("tức giận") || lower.includes("mất tiền") || lower.includes("vạch trần") || lower.includes("phẫn nộ")) {
            mucDo = "Cao (Cảnh báo Rage Bait!)";
            mau = "red";
            giai thích = "Phát hiện dấu hiệu sử dụng từ ngữ giật gân, cố tình kích động sự bất bình và thao túng cảm xúc người đọc.";
        }
        
        box.innerHTML = `<b>Kết quả phân tích:</b><br>` +
                        `- Mức độ kích động: <span style="color:${mau}; font-weight:bold;">${mucDo}</span><br>` +
                        `- Đánh giá chuyên gia tâm lý: ${giai thích}<br>` +
                        `- Lời khuyên: Hãy giữ bình tĩnh, hít thở sâu và kiểm chứng thông tin từ nhiều nguồn chính thống trước khi chia sẻ.`;
    }, 1000);
}

function batDauTho() {
    const status = document.getElementById('trang-thai-tho');
    status.style.color = "#27ae60";
    status.innerHTML = "Hít vào thật sâu... (4 giây)";
    setTimeout(() => {
        status.innerHTML = "Giữ hơi thở lại... (4 giây)";
        setTimeout(() => {
            status.innerHTML = "Thở ra từ từ... (4 giây)";
            setTimeout(() => {
                status.innerHTML = "Tuyệt vời! Tâm trí bạn đã được làm dịu. Hãy tiếp tục dự án thật tốt nhé!";
            }, 4000);
        }, 4000);
    }, 4000);
}
</script>

</body>
</html>
