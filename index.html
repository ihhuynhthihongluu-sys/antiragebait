<script>
        // CẤU HÌNH API MỚI (Từ api.gu.io.vn)
        const GU_API_KEY = "sk-abc123XYZ456def789ghi012JKL345mno678PQR901stu234"; // Thay bằng key thực tế nếu cần
        const API_BASE_URL = "https://api.gu.io.vn/v1";

        // DANH SÁCH MODEL MẶC ĐỊNH TỪ SERVER
        let globalTextModels = [
            "gemini-flash-lite",
            "gemini-flash",
            "gemini-pro",
            "gemini-argon"
        ];

        // TỰ ĐỘNG QUÉT TOÀN BỘ MODEL KHẢ DỤNG TỪ GU API
        async function fetchModels() {
            try {
                let res = await fetch(`${API_BASE_URL}/models`, {
                    method: "GET", 
                    headers: { "Authorization": `Bearer ${GU_API_KEY}` }
                });
                let data = await res.json();
                if (!data.error && data.data) {
                    let fetched = data.data.map(m => m.id);
                    if (fetched.length > 0) {
                        globalTextModels = [...new Set([...globalTextModels, ...fetched])];
                    }
                }
            } catch(e) {
                console.error("Lỗi khi tải danh sách model:", e);
            }
        }
        fetchModels();

        // HÀM GỌI API ĐA MODEL THỬ NGHIỆM (FALLBACK LOOP)
        async function callAPIWithFallback(messagesList, isVision = false, base64Img = null) {
            // Đối với Gemini, flash và pro thường đều hỗ trợ tốt vision
            let modelsToTry = isVision ? ["gemini-flash", "gemini-pro"] : globalTextModels;
            let lastError = "";

            for (let i = 0; i < modelsToTry.length; i++) {
                let currentModel = modelsToTry[i];
                try {
                    let messagesPayload = messagesList;
                    
                    // Xử lý định dạng cho Vision (Gắn ảnh vào tin nhắn cuối)
                    if (isVision && base64Img) {
                        messagesPayload = messagesList.map((msg, index) => {
                            if (index === messagesList.length - 1) {
                                return {
                                    role: msg.role,
                                    content: [
                                        { type: "text", text: msg.content },
                                        { type: "image_url", image_url: { url: base64Img } }
                                    ]
                                };
                            }
                            return msg;
                        });
                    }

                    let response = await fetch(`${API_BASE_URL}/chat/completions`, {
                        method: "POST",
                        headers: { 
                            "Authorization": `Bearer ${GU_API_KEY}`, 
                            "Content-Type": "application/json" 
                        },
                        body: JSON.stringify({ 
                            model: currentModel, 
                            messages: messagesPayload, 
                            temperature: 0.4, 
                            max_tokens: 1000 
                        })
                    });

                    let data = await response.json();
                    if (!data.error && data.choices && data.choices.length > 0) {
                        return { success: true, text: data.choices[0].message.content, model: currentModel };
                    } else {
                        lastError = data.error ? data.error.message : "Lỗi phản hồi từ server";
                    }
                } catch (err) {
                    lastError = err.message;
                }
            }
            return { success: false, error: lastError };
        }

        // CHUYỂN TAB
        function switchTab(tabId, btnElement, isFlex) {
            document.querySelectorAll('.khung-chinh').forEach(el => {
                el.classList.remove('active');
                el.classList.remove('flex-tab');
            });
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            let target = document.getElementById(tabId);
            target.classList.add('active');
            if(isFlex) target.classList.add('flex-tab');
            btnElement.classList.add('active');
        }

        // TAB 1: RAGEBAIT
        let base64Media = ""; 
        function previewMedia(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('previewContainer').style.display = 'block';
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > 800) { h = h * (800 / w); w = 800; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        base64Media = canvas.toDataURL('image/jpeg', 0.6);
                        document.getElementById('imgPreview').src = base64Media;
                        document.getElementById('imgPreview').style.display = 'block';
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }
        
        function removeMedia() {
            document.getElementById('mediaInput').value = ""; 
            document.getElementById('previewContainer').style.display = 'none';
            base64Media = ""; 
        }

        async function batDauQuetGroq() {
            let noiDungText = document.getElementById('o-nhap-lieu-rb').value.trim();
            if (noiDungText === "" && !base64Media) return alert("Vui lòng nhập nội dung hoặc tải ảnh lên để phân tích!");

            let btn = document.getElementById('nut-quet');
            btn.innerText = "ĐANG TÌM MODEL VÀ PHÂN TÍCH..."; btn.disabled = true;
            document.getElementById('khung-ket-qua').style.display = "block";
            document.getElementById('trang-thai').innerText = "Hệ thống đang quét các mô hình AI...";
            
            let promptSystem = `Phân tích chuyên sâu đề tài: Nghiên cứu hiện tượng Rage Bait và bạo lực học đường. BẮT BUỘC TRẢ VỀ:
ĐIỂM: [0-100]
KẾT LUẬN: [RAGE BAIT CAO / TIỀM TẨY / AN TOÀN]
1. PHÂN TÍCH CẤU TRÚC NGÔN TỪ: [Chi tiết]
2. BẪY TÂM LÝ & THAO TÚNG CẢM XÚC: [Chi tiết]
3. NGUY CƠ TƯƠNG QUAN ĐẾN BẠO LỰC HỌC ĐƯỜNG: [Chi tiết]
4. ĐỀ XUẤT GIẢI PHÁP GỠ RỐI (CONSIDER): [Chi tiết]`;
            
            let fullText = promptSystem + (noiDungText ? `\n\nNội dung: "${noiDungText}"` : "");
            let messages = [{ role: "user", content: fullText }];
            
            let result = await callAPIWithFallback(messages, base64Media !== "", base64Media);

            if (!result.success) {
                document.getElementById('van-ban-ket-qua').innerHTML = `<span style='color:#f43f5e;'>Không thể kết nối với tất cả các model. Lỗi: ${result.error}</span>`;
            } else {
                let vanBanAI = result.text.replace(/\*\*/g, ''); 
                let diemSo = vanBanAI.match(/ĐIỂM.*?(\d+)/i) ? parseInt(vanBanAI.match(/ĐIỂM.*?(\d+)/i)[1]) : 0;
                
                let targetColor = diemSo > 65 ? "#f43f5e" : (diemSo > 30 ? "#f59e0b" : "#10b981");
                document.getElementById('trang-thai').innerText = (diemSo > 65 ? "CẢNH BÁO: RAGE BAIT NGHIÊM TRỌNG ⚠" : "NỘI DUNG ĐÁNH GIÁ") + ` (Model: ${result.model})`;
                document.getElementById('so-diem').style.color = targetColor;
                document.getElementById('thanh-mau').style.background = targetColor;
                document.getElementById('thanh-mau').style.width = diemSo + "%";
                document.getElementById('so-diem').innerText = diemSo + "%";

                document.getElementById('van-ban-ket-qua').innerHTML = vanBanAI
                    .replace(/ĐIỂM:.*\n/i, '')
                    .replace(/KẾT LUẬN:(.*)/i, "<b style='color:#10b981; font-size: 16px;'>KẾT LUẬN: $1</b><br>")
                    .replace(/1\. PHÂN TÍCH CẤU TRÚC NGÔN TỪ:/i, '<div class="tieu-de-phan-tich">1. Phân tích cấu trúc ngôn từ</div>')
                    .replace(/2\. BẪY TÂM LÝ & THAO TÚNG CẢM XÚC:/i, '<div class="tieu-de-phan-tich">2. Bẫy tâm lý & thao túng cảm xúc</div>')
                    .replace(/3\. NGUY CƠ TƯƠNG QUAN ĐẾN BẠO LỰC HỌC ĐƯỜNG:/i, '<div class="tieu-de-phan-tich">3. Nguy cơ tương quan đến bạo lực học đường</div>')
                    .replace(/4\. ĐỀ XUẤT GIẢI PHÁP GỠ RỐI \(CONSIDER\):/i, '<div class="tieu-de-phan-tich">4. Đề xuất giải pháp gỡ rối (Consider)</div>');
            }
            btn.innerText = "Phân tích chuyên sâu tự động"; btn.disabled = false;
        }

        // TAB 2: BREATHE
        let stream = null, isBreathing = false, breatheInterval;
        async function toggleCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop()); stream = null;
                document.getElementById('webcam-feed').style.opacity = '0';
                document.getElementById('webcam-overlay').style.display = 'none'; 
                document.getElementById('btn-cam').innerText = "📷 Bật Gương"; 
            } else {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    document.getElementById('webcam-feed').srcObject = stream; 
                    document.getElementById('webcam-overlay').style.display = 'block'; 
                    setTimeout(() => { document.getElementById('webcam-feed').style.opacity = '0.6'; }, 100);
                    document.getElementById('btn-cam').innerText = "🔴 Tắt Gương"; 
                } catch (err) { alert("Vui lòng cho phép quyền Camera!"); }
            }
        }
        
        function toggleBreathe() {
            let outer = document.getElementById('circle-outer'), inner = document.getElementById('circle-inner');
            let text = document.getElementById('breathe-text'), btn = document.getElementById('btn-breathe');
            
            if (isBreathing) {
                isBreathing = false; clearInterval(breatheInterval); 
                outer.classList.remove('expand'); inner.classList.remove('expand');
                text.innerText = "SẴN SÀNG CHƯA?"; btn.innerText = "Bắt đầu tập thở"; 
                return;
            }
            isBreathing = true; btn.innerText = "Dừng lại"; 
            function breatheCycle() {
                text.innerText = "HÍT VÀO TỪ TỪ..."; text.style.color = "#34d399";
                outer.classList.add('expand'); inner.classList.add('expand');
                setTimeout(() => {
                    text.innerText = "THỞ RA NHẸ NHÀNG..."; text.style.color = "#f472b6";
                    outer.classList.remove('expand'); inner.classList.remove('expand');
                }, 4000); 
            }
            breatheCycle(); breatheInterval = setInterval(breatheCycle, 8000);
        }

        // TAB 3: DIARY (SOCRATES AI)
        let chatHistory = [{ role: "system", content: "Bạn là chuyên gia tâm lý học đường sử dụng phương pháp Socratic. Không khuyên sáo rỗng. Hãy đồng cảm ngắn gọn và đặt 1-2 câu hỏi mở sâu sắc để học sinh tự nhận thức." }];
        let recognition, isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'vi-VN'; recognition.continuous = false; recognition.interimResults = true;
            recognition.onresult = function(event) {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                }
                if (finalTranscript !== '') {
                    let currentVal = document.getElementById("user-input-diary").value;
                    document.getElementById("user-input-diary").value = currentVal + (currentVal ? " " : "") + finalTranscript;
                }
            };
            recognition.onend = function() { isRecording = false; document.getElementById("btn-mic").classList.remove("recording"); };
        }

        function toggleMic() {
            if (!recognition) return alert("Trình duyệt không hỗ trợ thu âm.");
            if (isRecording) { recognition.stop(); } 
            else { recognition.start(); isRecording = true; document.getElementById("btn-mic").classList.add("recording"); }
        }

        async function sendDiary() {
            let input = document.getElementById("user-input-diary");
            let text = input.value.trim();
            if (!text) return;

            if (isRecording && recognition) recognition.stop();

            appendMessageDiary(text, "entry-student", "Bạn");
            input.value = ""; input.disabled = true;
            document.getElementById("btn-send-diary").disabled = true;
            document.getElementById("typing-indicator").style.display = "block";
            
            chatHistory.push({ role: "user", content: text });
            
            let result = await callAPIWithFallback(chatHistory);

            if (!result.success) {
                appendMessageDiary("Lỗi kết nối tất cả model AI.", "entry-ai", "Hệ Thống");
                chatHistory.pop();
            } else {
                chatHistory.push({ role: "assistant", content: result.text });
                appendMessageDiary(result.text, "entry-ai", `Socrates AI (${result.model})`);
            }

            document.getElementById("typing-indicator").style.display = "none";
            input.disabled = false; document.getElementById("btn-send-diary").disabled = false;
            input.focus();
        }

        function appendMessageDiary(text, className, labelName) {
            let box = document.getElementById("diary-box");
            let div = document.createElement("div"); div.className = `entry ${className}`;
            div.innerHTML = `<div class="label-chat">${labelName}</div><div class="content">${text.replace(/\n/g, "<br>").replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")}</div>`;
            box.appendChild(div); box.scrollTop = box.scrollHeight;
        }
    </script>
